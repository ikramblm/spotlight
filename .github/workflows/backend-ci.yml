name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spotlight
          POSTGRES_PASSWORD: spotlight
          POSTGRES_DB: spotlight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spotlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://spotlight:spotlight@localhost:5432/spotlight_test
      JWT_ACCESS_SECRET: ci-only-access-secret-do-not-use-in-prod-0000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-do-not-use-in-prod-0000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      # Runs the full suite, DB-free unit tests and Postgres-backed integration tests alike -
      # the integration tests have existed since Phase 1 but this is the first place they've
      # ever actually run against a real database (the local dev sandbox this project was built
      # in has none). `npm test`'s own `pretest` applies migrations first.
      - run: npm test
